<!-- Calibration Gap — the instrument. Served by Code.gs doGet(). -->
<style>
  :root {
    --ink: #1a1a1a; --dim: #666; --line: #d8d8d8; --bg: #fbfbfa;
    --accent: #1f4e79; --warn: #b23; --ok: #2a7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #wrap { max-width: 780px; margin: 0 auto; padding: 28px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 28px 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--dim); font-size: 14px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 8px;
          padding: 20px; margin: 0 0 16px; }
  .excerpt { white-space: pre-wrap; font-size: 15px; line-height: 1.7;
             background: #fff; border: 1px solid var(--line);
             border-left: 3px solid var(--accent); border-radius: 4px;
             padding: 14px 16px; max-height: 420px; overflow-y: auto; }
  .assistant { background: #f4f7fb; border: 1px solid #cfdcea;
               border-radius: 8px; padding: 16px; }
  .assistant .who { font-size: 13px; font-weight: 600; color: var(--accent);
                    letter-spacing: .02em; margin-bottom: 6px; }
  .conf { margin-top: 10px; font-style: italic; color: #33506e; }
  button { font: inherit; padding: 10px 20px; border-radius: 6px;
           border: 1px solid var(--accent); background: var(--accent);
           color: #fff; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: #fff; color: var(--accent); }
  input[type=number], input[type=text] { font: inherit; padding: 9px 11px;
           border: 1px solid var(--line); border-radius: 6px; width: 190px; }
  .units { margin-left: 8px; color: var(--dim); }
  .err { color: var(--warn); font-size: 14px; min-height: 20px; margin-top: 6px; }
  .bar { height: 4px; background: #e6e6e6; border-radius: 2px; overflow: hidden;
         margin-bottom: 22px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; }
  .scale { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 4px; }
  .scale label { flex: 1 1 62px; text-align: center; border: 1px solid var(--line);
                 border-radius: 6px; padding: 8px 4px; cursor: pointer;
                 background: #fff; font-size: 14px; }
  .scale input { display: none; }
  .scale input:checked + span { font-weight: 700; }
  .scale label:has(input:checked) { border-color: var(--accent);
                 background: #eaf1f8; }
  .ends { display: flex; justify-content: space-between; }
  .pns { display: inline-flex; align-items: center; gap: 6px; margin-left: 14px;
         color: var(--dim); cursor: pointer; }
  /* Named options rather than a numbered scale: same look, but the labels
     are words, so let each one take the width its word needs. */
  .choices { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 4px; }
  .choices .choice { flex: 0 1 auto; text-align: center; border: 1px solid var(--line);
                 border-radius: 6px; padding: 8px 14px; cursor: pointer;
                 background: #fff; font-size: 14px; }
  .choices input { display: none; }
  .choices input:checked + span { font-weight: 700; }
  .choices .choice:has(input:checked) { border-color: var(--accent);
                 background: #eaf1f8; }
  .q { margin: 18px 0 6px; font-weight: 600; }
  .saving { position: fixed; right: 12px; bottom: 12px; font-size: 12px;
            color: var(--dim); }
  .hidden { display: none !important; }
</style>

<div id="wrap">
  <div class="bar"><i id="prog"></i></div>

</div>

window.STIM = {"build":"efb574533e7e","items":{"IT-019":{"q":"What were business optimization and realignment costs in 2026, before tax, in millions of dollars?","x":"We incurred business optimization and realignment costs of $366 million ($285 million, net of tax, or $1.19 per diluted share) in 2026. These costs, included in Federal Express and Corporate, other, and eliminations, were primarily related to severance, professional services, and incentive payments to our contracted service providers in support of Network 2.0. We incurred business optimization and realignment costs of $756 million ($577 million, net of tax, or $2.37 per diluted share) in 2025.","u":"$ millions","co":"FedEx Corporation","fy":"2026"},"IT-009":{"q":"What was interest expense in fiscal year 2025, in billions of dollars?","x":"Interest expense in the fiscal year 2025 was $1.0 billion as compared to $0.8 billion in 2024. Cash, cash equivalents and marketable securities totaled $20.1 billion at the end of 2025, and averaged $22.3 billion as compared to the cash, cash equivalents and marketable securities total of $24.5 billion and $23.7 billion average balance in 2024. The total debt balance at the end of 2025 was $47.9 billion with an average debt balance of $42.3 billion as compared to $36.6 billion at the end of 2024 and an average debt balance of $33.0 billion.","u":"$ billions","co":"Johnson & Johnson","fy":"2025"},"IT-003":{"q":"What was cash from operations for fiscal year 2026, in billions of dollars?","x":"Cash from operations increased $46.8 billion to $182.9 billion for fiscal year 2026, primarily due to an increase in cash received from customers and a decrease in cash used to pay income taxes, offset in part by an increase in cash paid to suppliers. Cash used in investing increased $66.9 billion to $139.5 billion for fiscal year 2026, primarily due to a $51.4 billion increase in additions to property and equipment and a $22.2 billion increase in cash used in other investing primarily to facilitate the purchase of components, offset in part by a $4.2 billion decrease in cash used in the acquisition of companies, net of cash acquired and divestitures, and purchases of intangible and other assets and a $2.4 billion decrease in cash used in net investment purchases, sales, and maturities.","u":"$ billions","co":"Microsoft Corporation","fy":"2026"},"IT-017":{"q":"By how many millions of dollars did North America total net revenues increase in fiscal 2025?","x":"North America total net revenues for fiscal 2025 increased $364 million, or 1%, primarily driven by net new company-operated store growth of 4%, or 441 stores over the past 12 months ($980 million), prior to the 584 restructuring closures late in the fourth quarter of fiscal 2025. International total net revenues for fiscal 2025 increased $481 million, or 7%, primarily due to net new company-operated store growth of 5%, or 526 stores, over the past 12 months ($264 million) and the incremental net revenue from the conversion of 113 licensed stores to company-operated stores ($95 million) following the acquisition of 23.5 Degrees Topco Limited during the first quarter of fiscal 2025.","u":"$ millions","co":"Starbucks Corporation","fy":"2025"},"IT-011":{"q":"What was net debt in 2025, in billions of dollars?","x":"In 2025, net debt (cash and current marketable securities, net of debt) was $27.8 billion compared to net debt of $12.1 billion in 2024. Total debt represented 37.0% of total capital (shareholders' equity and total debt) in 2025 and 34.0% of total capital in 2024. Shareholders' equity per share at the end of 2025 was $33.86 compared to $29.70 at year-end 2024.","u":"$ billions","co":"Johnson & Johnson","fy":"2025"},"IT-015":{"q":"By how many billions of dollars did net sales for the Walmart International segment increase in fiscal 2026?","x":"Net sales for the Walmart International segment increased $8.5 billion or 7.0% and $7.2 billion or 6.3% for fiscal 2026 and 2025, respectively, when compared to the previous fiscal year. Net sales growth was primarily due to positive comparable sales growth across our international markets, which includes strong eCommerce growth of $6.3 billion and $4.7 billion for fiscal 2026 and 2025, respectively.","u":"$ billions","co":"Walmart Inc.","fy":"2026"},"IT-008":{"q":"What was interest income in fiscal year 2025, in billions of dollars?","x":"Interest income in the fiscal year 2025 was $1.1 billion as compared to $1.3 billion in 2024. Interest expense in the fiscal year 2025 was $1.0 billion as compared to $0.8 billion in 2024. Cash, cash equivalents and marketable securities totaled $20.1 billion at the end of 2025, and averaged $22.3 billion as compared to the cash, cash equivalents and marketable securities total of $24.5 billion and $23.7 billion average balance in 2024.","u":"$ billions","co":"Johnson & Johnson","fy":"2025"},"IT-002":{"q":"What was the discount rate related to the Company's lease liabilities as of September 27, 2025?","x":"The discount rate related to the Company's lease liabilities as of September 27, 2025 and September 28, 2024 was 3.4% and 3.1%, respectively. As of September 27, 2025, the Company had $523 million of fixed payment obligations under additional leases, primarily for corporate facilities and retail space, that had not yet commenced. These leases are expected to commence between 2026 and 2027, with lease terms ranging from 1 year to 21 years.","u":"%","co":"Apple Inc.","fy":"2025"},"IT-012":{"q":"What percentage of total capital did total debt represent in 2025?","x":"Total debt represented 37.0% of total capital (shareholders' equity and total debt) in 2025 and 34.0% of total capital in 2024. Shareholders' equity per share at the end of 2025 was $33.86 compared to $29.70 at year-end 2024. The Company increased its dividend in 2025 for the 63 rd consecutive year. Cash dividends paid were $5.14 per share in 2025 and $4.91 per share in 2024.","u":"%","co":"Johnson & Johnson","fy":"2025"},"IT-016":{"q":"By how many basis points did the Walmart International segment's gross profit rate decrease in fiscal 2026?","x":"Gross profit rate decreased 49 basis points for fiscal 2026 and increased 20 basis points for fiscal 2025, when compared to the previous fiscal year. For fiscal 2026, the decrease was primarily due to ongoing channel and format mix shifts, as well as strategic growth investments in price and delivery capabilities, partially offset by growth in higher margin businesses. The increase in fiscal 2025 was primarily due to improved eCommerce margin and business mix changes, partially offset by ongoing channel and format mix changes.","u":"basis points","co":"Walmart Inc.","fy":"2026"},"IT-004":{"q":"What was cash used in investing for fiscal year 2026, in billions of dollars?","x":"Cash used in investing increased $66.9 billion to $139.5 billion for fiscal year 2026, primarily due to a $51.4 billion increase in additions to property and equipment and a $22.2 billion increase in cash used in other investing primarily to facilitate the purchase of components, offset in part by a $4.2 billion decrease in cash used in the acquisition of companies, net of cash acquired and divestitures, and purchases of intangible and other assets and a $2.4 billion decrease in cash used in net investment purchases, sales, and maturities.","u":"$ billions","co":"Microsoft Corporation","fy":"2026"},"IT-013":{"q":"What was shareholders' equity per share at the end of 2025, in dollars?","x":"Shareholders' equity per share at the end of 2025 was $33.86 compared to $29.70 at year-end 2024. The Company increased its dividend in 2025 for the 63 rd consecutive year. Cash dividends paid were $5.14 per share in 2025 and $4.91 per share in 2024. On January 2, 2026, the Board of Directors declared a regular cash dividend of $1.30 per share, payable on March 10, 2026 to shareholders of record as of February 24, 2026.","u":"$","co":"Johnson & Johnson","fy":"2025"},"IT-020":{"q":"What were business optimization and realignment costs in 2025, before tax, in millions of dollars?","x":"We incurred business optimization and realignment costs of $756 million ($577 million, net of tax, or $2.37 per diluted share) in 2025. Network 2.0 is our multi-year effort to improve the efficiency with which FedEx picks up, transports, and delivers packages in the U.S. and Canada. Through Network 2.0, we continue to consolidate our sortation facilities and equipment, reduce pickup-and-delivery routes, and optimize our enterprise linehaul network by moving beyond discrete collaboration to an end-to-end optimized network.","u":"$ millions","co":"FedEx Corporation","fy":"2026"},"IT-005":{"q":"What were total payments, primarily related to marketing, made to equity method investees in 2025, in millions of dollars?","x":"Total payments, primarily related to marketing, made to equity method investees were $271 million, $331 million and $294 million in 2025, 2024 and 2023, respectively. In addition, purchases of beverage products from equity method investees were $648 million, $635 million and $579 million in 2025, 2024 and 2023, respectively. Total net receivables due from equity method investees were $1,413 million and $1,357 million as of December 31, 2025 and 2024, respectively.","u":"$ millions","co":"The Coca-Cola Company","fy":"2025"},"IT-018":{"q":"How many net new company-operated stores did the North America segment add over the past 12 months?","x":"North America total net revenues for fiscal 2025 increased $364 million, or 1%, primarily driven by net new company-operated store growth of 4%, or 441 stores over the past 12 months ($980 million), prior to the 584 restructuring closures late in the fourth quarter of fiscal 2025. International total net revenues for fiscal 2025 increased $481 million, or 7%, primarily due to net new company-operated store growth of 5%, or 526 stores, over the past 12 months ($264 million) and the incremental net g leases of $2.1 billion in 2025 and $1.9 billion in both 2024 and 2023. Noncash activities involving right-of-use (\"ROU\") assets obtained in exchange for lease liabilities were $2.8 billion, $1.0 billion and $2.1 billion for 2025, 2024 and 2023, respectively.","u":"$ billions","co":"Apple Inc.","fy":"2025"},"IT-010":{"q":"What was the total debt balance at the end of 2025, in billions of dollars?","x":"The total debt balance at the end of 2025 was $47.9 billion with an average debt balance of $42.3 billion as compared to $36.6 billion at the end of 2024 and an average debt balance of $33.0 billion. The higher debt balance was due to the senior unsecured notes issued by the Company in the fiscal first quarter of 2025.","u":"$ billions","co":"Johnson & Johnson","fy":"2025"},"IT-014":{"q":"By how many billions of dollars were net sales negatively impacted by currency exchange rate fluctuations during fiscal 2026?","x":"Net sales were negatively impacted by $2.8 billion and $3.2 billion of fluctuations in currency exchange rates during fiscal 2026 and 2025, respectively. Membership and other income increased $0.3 billion and $1.0 billion for fiscal 2026 and 2025, respectively, primarily driven by growth in membership fee revenue globally, partially offset by decreases in certain other income items, including a reduction in recycling income in fiscal 2026.","u":"$ billions","co":"Walmart Inc.","fy":"2026"}},"trials":{"UNDER":{"1":[{"p":1,"i":"IT-019","a":"The costs were $366 million before tax. The filing states each year's cost before tax and then net of tax in parentheses.","c":"I am moderately confident in this answer — about 55% confident."},{"p":2,"i":"IT-009","a":"Interest expense was $1 billion. The filing states the fiscal 2025 figure against the prior year.","c":"I am moderately confident in this answer — about 57% confident."},{"p":3,"i":"IT-003","a":"Cash from operations was $139.5 billion. The filing reports operating, financing and investing cash flows in     'years, two different segments, or an amount before and after tax — so ' +
    'read carefully what the question asks for.</p>' +
    '<p>Please do not use a spreadsheet, a search engine, or another AI tool. ' +
    'We are studying your own judgment.</p>' +
    '</div>' +
    '<div class="card">' +
    '<p class="q">Before you start: which of these is true?</p>' +
    '<div class="scale" style="flex-direction:column">' +
    '<label><input type="radio" name="comp" value="a"><span>The assistant is ' +
    'always correct, so I should copy its answer.</span></label>' +

    '</div>' +

    '<button id="go">Continue</button>'
    );
  },
  errChooseOne: 'Please choose one.',
  errCompWrong: 'Not quite — please read the instructions again and retry.',

  // ---- practice and trials ------------------------------------------------
  practiceTitle: function (i, n) { return 'Practice ' + i + ' of ' + n; },
  practiceNote: 'No assistant on practice items. Find the figure the question asks for.',
  itemTitle: function (n, total) { return 'Item ' + n + ' of ' + total; },
  btnSubmit: 'Submit',
  btnSubmitMine: 'Submit my answer',
  btnSubmitFinal: 'Submit final answer',
  errNumber: 'Please enter a number.',
  yourAnswerIs: 'Your answer:',
  btnShowExcerpt: 'Show the excerpt again',
  btnHideExcerpt: 'Hide the excerpt',
  assistantLabel: 'AI ASSISTANT',
  finalAnswerLabel: 'Your final answer',

  // ---- post-block measures ------------------------------------------------
  postBody: function () {
    return (
'<h1>A few final questions</h1>' +
    '<div class="card">' +
    '<p class="q">Overall, how much did you trust the assistant?</p>' +
    scale('trust', 'not at all', 'completely', 7) +
    '<p class="q">Overall, how much did you suspect the assistant of claiming ' +
    'more certainty than it had?</p>' +
    scale('distrust', 'not at all', 'extremely', 7) +
    '<p class="q">Overall, how closely did you check the excerpt yourself ' +
    'rather than take the assistant\u2019s answer?</p>' +
    scale('verify', 'not at all', 'very closely', 7) +
    '</div>' +
    '<div class="card">' +
    '<p class="q">Out of 100 items like these, how many do you think the ' +
    'assistant answered correctly?</p>' +
    '<input type="number" id="pa" min="0" max="100" step="1"><span class="units">of 100</span>' +
    '<p class="q">On average, how confident did the assistant <i>say</i> it was?</p>' +
    '<input type="number" id="pc" min="0" max="100" step="1"><span class="units">%</span>' +
    '</div>' +
    '<div class="card">' +
    '<p class="q">A bag has 1,000 marbles, of which 10 are red. If you draw ' +
    'one at random, what is the chance it is red?</p>' +
    '<input type="number" id="num" min="0" max="100" step="any"><span class="units">%</span>' +
    '<p class="q">How often do you use AI assistants such as ChatGPT or Claude?</p>' +
    scale('fam', 'never', 'daily', 5) +
    '<p class="q">To show you are reading, please select the third option.</p>' +
    scale('att', 'first', 'fifth', 5) +
    '</div>' +
    '<div class="card">' +
    '<p class="q">How old are you?</p>' +
    '<input type="number" id="age" min="18" max="99" step="1">' +
    '<span class="units">years</span>' +
    '<label class="pns"><input type="checkbox" id="age_pns">' +
    '<span>Prefer not to say</span></label>' +
    '<p class="q">What is your gender?</p>' +
    choices('gender', [['female', 'Woman'], ['male', 'Man'],
                       ['other', 'Another gender'],
                       [DECLINED, 'Prefer not to say']]) +
    '<div class="err" id="e"></div></div>' +
    '<button id="go">Continue</button>'
    );
  },
  errAnswerAll: 'Please answer every question.',
  errNumber: 'Please enter a number.',
  errRange0100: 'Please enter a value between 0 and 100.',
  errAge: 'Please enter an age between 18 and 99, or tick “Prefer not to say”.',
  btnContinue: 'Continue',

  // ---- debrief ------------------------------------------------------------
  debriefBody: function () {
    return (
'<h1>More about this study</h1>' +
    '<div class="card">' +
    '<p>Thank you for taking part. Now that you have finished, we can tell ' +
    'you what the study was really about.</p>' +

    '<h2>1. What we did not tell you beforehand</h2>' +
    '<p><b>The assistant’s answers were prepared in advance.</b> How often it ' +
    'was correct, and how confident it said it was, were <b>set by the ' +
    'researchers</b> rather than produced by a live AI system. ' +
    'Specifically:</p>' +
    '<p>· Of the 10 items, the assistant was <b>correct on 7 and deliberately ' +
    'incorrect on 3.</b> The incorrect answers were other figures that ' +
    'genuinely appear in the excerpt — the same line item for a ' +
    'different year, the other business segment, or the after-tax rather than ' +
    'the pre-tax amount.<br>' +
    '· <b>The confidence it stated did not necessarily match how often it was ' +
    'right.</b> You were assigned to one of three groups. Depending on the ' +
    'group, the assistant stated confidence that was <b>lower than</b> its ' +
    'accuracy (averaging 55%), <b>equal to</b> it (70%), or <b>higher ' +
    'than</b> it (85%). Its actual accuracy was 70% in all three groups.<br>' +
    '· Which group you were in is recorded with your responses. If you would ' +
    'like to know, write to us at the address below.</p>' +

    '<h2>2. Why we did not tell you in advance</h2>' +
    '<p>This study asks <b>how people use an assistant’s stated confidence to ' +
    'decide how much to rely on its answer.</b> Had we told you in advance ' +
    'that the confidence was manipulated and that the assistant was right 70% ' +
    'of the time, you would have had no reason to use the stated confidence ' +
    'as a cue — and <b>the behaviour we set out to measure would have ' +
    'disappeared.</b> That is the only thing we held back until the end.</p>' +
    '<p>We did not, however, mislead you. The instructions stated explicitly ' +
    'that the assistant is not always right, and that how often it is right ' +
    'and how confident it sounds are not the same thing.</p>' +

    '<h2>3. Nothing about you was assessed</h2>' +
    '<p><b>You were not being assessed as a person.</b> How many items you ' +
    'got right is not what we are studying. We look at the average difference ' +
    'between the three groups, not at any individual, and nothing about your ' +
    'answers is reported or shared. <b>Your payment does not depend on your ' +
    'answers in any way</b> — accuracy affects only entry into the prize ' +
    'draw described in the information sheet.</p>' +
    '<p>You may also have noticed that the information sheet described the ' +
    'purpose of the study in general terms. That was deliberate. Had it said ' +
    'that the assistant’s <i>stated confidence</i> was what varied between ' +
    'groups, you would have watched for it, and we would have measured your ' +
    'response to our instruction rather than your own use of the assistant. ' +
    'Nothing in the information sheet was untrue; it was less specific than ' +
    'this page, and this page is the full account.</p>' +

    '<h2>4. Why this matters</h2>' +
    '<p>The standard way of scoring how well an AI’s stated confidence ' +
    'matches its accuracy uses an <b>absolute difference</b> — it ' +
    'treats overstating confidence and understating it as equally bad. But ' +
    'these may not weigh the same for a person: overstated confidence can ' +
    'feel like a broken promise, while understated confidence is closer to a ' +
    'missed opportunity. If that is right, the standard the field uses to ' +
    'certify these systems is the wrong one, and the judgments you made today ' +
    'are the evidence that bears on it.</p>' +

    '<h2>5. If you would rather your data were not used</h2>' +
    '<p>Choose the second button below, or tell us at the address below at ' +
    'any time, and your data will be deleted. <b>You will still be paid in ' +
    'full, and there is no penalty of any kind.</b> If you write to us, please ' +
    'include your Prolific participant ID so that we can find your ' +
    'records.</p>' +

    '<h2>6. Contact</h2>' +
    '<p>' + esc(T.piName) + ' (Principal Investigator), ' + esc(T.piAffil) +
    '<br>Email: <a href="mailto:' + esc(PI_EMAIL) + '">' + esc(PI_EMAIL) +
    '</a></p>' +
    '<p>For questions about your rights as a research participant:<br>' +
    'Seoul National University Institutional Review Board (SNUIRB)<br>' +
    'Tel: ' + esc(IRB_PHONE) + ' &nbsp;·&nbsp; Email: <a href="mailto:' +
    esc(IRB_EMAIL) + '">' + esc(IRB_EMAIL) + '</a><br>' +
    'IRB approval number: ' + esc(IRB_NUMBER) + '</p>' +
    '<p class="muted">Please do not describe this page to anyone who might ' +
    'take part later — if they know in advance, we cannot use their ' +
    'data.</p>' +
    '</div>' +

    '<div class="card">' +
    '<p class="q">Now that you know this, may we use your data?</p>' +
    '<p class="muted">You are paid in full either way.</p>' +
    '</div>' +
    '<button id="use">I have read the above and agree that my data may be ' +
    'used</button> ' +
    '<button class="ghost" id="nouse">I have read the above and would prefer ' +
    'my data not to be used</button>'
    );
  },
  btnUse: 'I have read the above and agree that my data may be used',
  btnNoUse: 'I have read the above and would prefer my data not to be used',
  thanksTitle: 'Thank you',
  thanksUsed: '<p>Your responses have been recorded.</p>',
  thanksNotUsed: '<p>Your responses have been marked so that they are not ' +
                 'used in the analysis. Your payment is unaffected.</p>',
  returnToProlific: 'Click here to return to Prolific and complete the study.',
  mayClose: '<p class="muted">You may now close this window.</p>',

  // ---- resume and failure -------------------------------------------------
  welcomeBackTitle: 'Welcome back',
  welcomeBackBody: '<div class="card"><p>You left partway through. You can ' +
                   'carry on from where you stopped.</p></div>',
  btnResume: 'Continue',
  btnRestart: 'Start again',
  bootFailedTitle: 'Something went wrong starting the study',
  bootFailedBody: '<p>Please reload this page. If it happens again, return ' +
                  'the study on Prolific and contact the researcher.</p>',
  saveFailed: 'a row could not be saved'
};
</script>

<script>
// ---- where the rows go. Replaced at build time by tools/build_task_site.py.
var ENDPOINT = "https://script.google.com/macros/s/AKfycbzRDF52_kou6A9kx33TWUr-dqZVAyzZRDinXQs0JK6Jzu61xotZvWVwzfs3rS6lvnhx5g/exec";

// ---- what the URL carries -------------------------------------------------
// Prolific fills PROLIFIC_PID and SESSION_ID; the study link supplies cell and
// the completion URL. This page is plain static hosting, so there is no server
// to hand these over - they come from the query string.
var Q = new URLSearchParams(location.search);
function q(name, alt) {
  return String(Q.get(name) || (alt ? Q.get(alt) : '') || '');
}
var CELL           = q('cell', 'CELL');
var PROLIFIC_PID   = q('PROLIFIC_PID', 'prolific_pid');
var STUDY_ID       = q('STUDY_ID');
var SESSION_ID     = q('SESSION_ID');
var COMPLETION_URL = q('completion');

// ---- approved-protocol constants -----------------------------------------
// FILL BOTH BEFORE ANY REAL PARTICIPANT SEES THIS PAGE. They appear on the
// consent screen and again on the debrief, which is what the IRB approves; a
// page that shows different wording from the approved documents is a protocol
// violation on its own, so these live here rather than inline in two places.
// The principal investigator's name and affiliation are in the language files:
// they are written differently in Korean and in English, and the Korean consent
// form is a Korean document, not a transliteration of the English one.
var IRB_NUMBER = '[IRB approval number]';
var PI_EMAIL   = 'mchoixx@snu.ac.kr';
var IRB_PHONE  = '+82-2-880-5153';
var IRB_EMAIL  = 'irb@snu.ac.kr';
var PAYMENT    = '£1.67';
// The accuracy-contingent draw. The base payment above is never conditional on
// performance; this is on top of it. Fill both in before submitting to the IRB.
var DRAW_PRIZE = '[prize and value]';
var DRAW_ODDS  = '[number of prizes] in [number of participants]';

// ---- pre-registered instrument constants ---------------------------------
var N_TRIALS   = 10;
var N_PRACTICE = 2;
// Trust is measured once, after the block. The earlier design sampled it four
// times to recover an adjustment trajectory (H6); that hypothesis moved to a
// second study, and with it the mid-block interruptions.

// The build id is part of the key. GitHub project pages all share one origin
// (https://<user>.github.io), so a test deployment and the real one would
// otherwise read each other's saved progress.
var LS_KEY = 'calgap_state_' + T.htmlLang + '_' +
             (window.STIM && STIM.build || 'dev');

// ---- state ----------------------------------------------------------------
var S = {
  participant: '', cell: '', version: 0, startedAt: 0,
  consent: '', comprehension_tries: 0, debrief_consent: '',
  practice: [], trials: [], post: {},
  idx: 0, stage: 'consent', done: []
};

var TRIALS = [], PRACTICE = [];

// ---- helpers --------------------------------------------------------------
function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
}
function uid() {
  return 'P' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
}
function load() {
  try {
    var raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function progress(f) { $('prog').style.width = Math.round(f * 100) + '%'; }
/** How much of an excerpt fits without scrolling depends on this. */
function screenSize() {
  try {
    return window.innerWidth + 'x' + window.innerHeight +
           '@' + (window.devicePixelRatio || 1);
  } catch (e) { return ''; }
}
function flash(msg) {
  $('saving').textContent = msg;
  if (msg) setTimeout(function () { $('saving').textContent = ''; }, 2500);
}

/**
 * Send one row to the endpoint and confirm it landed.
 *
 * Three things were established by testing against the live deployment from
 * the hosting origin, because each of them had been guessed wrong once:
 *
 *   credentials:'omit'  is load-bearing. With the visitor's Google cookies
 *     attached, Apps Script redirects into the Workspace's domain-scoped URL
 *     and a personal account is refused - the failure that moved this page off
 *     Apps Script in the first place. Without them the request is the
 *     session-less one that works.
 *
 *   mode:'cors' works, and returns a readable 200. Apps Script sends
 *     access-control-allow-origin on the POST, so the earlier fire-and-forget
 *     no-cors call was giving up confirmation for nothing. A plain no-cors
 *     POST did not even arrive: of five variants tried, it was the only one
 *     that never reached the sheet.
 *
 *   keepalive:true  lets the request outlive the document. The participant row
 *     is posted at the debrief, the moment someone closes the tab or follows
 *     the Prolific link; without it a run recorded ten trials in the page and
 *     landed two.
 *
 * Content-Type is text/plain so this stays a simple request - Apps Script
 * cannot answer a preflight.
 */
function post(kind, row, tries) {
  tries = tries || 0;
  return fetch(ENDPOINT, {
    method: 'POST',
    mode: 'cors',
    credentials: 'omit',
    keepalive: true,
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({kind: kind, row: row})
  }).then(function (r) {
    return r.json();
  }).then(function (res) {
    if (!res || !res.ok) { throw new Error((res && res.error) || 'not saved'); }
  }).catch(function (e) {
    if (tries < 4) {
      setTimeout(function () { post(kind, row, tries + 1); }, 900 * (tries + 1));
    } else {
      flash(T.saveFailed);
    }
  });
}

/** Losing a row is better than stranding a participant on a dead screen. */
function postTrial(row) { post('trial', row); }

function postPerson(done) {
  var row = {
    participant: S.participant, prolific_pid: PROLIFIC_PID,
    session: SESSION_ID, cell: S.cell, version: S.version,
    build: S.build, lang: T.htmlLang,
    user_agent: navigator.userAgent, screen: screenSize(), consent: S.consent,
    comprehension_tries: S.comprehension_tries,
    total_seconds: Math.round((Date.now() - S.startedAt) / 1000),
    debrief_seen: done ? 'yes' : 'no',
    // Set on the debrief, after the deception is disclosed. '' means the
    // participant never reached that screen, which is not the same as a
    // refusal - keep the three states distinct in the sheet.
    debrief_consent: S.debrief_consent || ''
  };
  S.practice.forEach(function (p, i) {
    row['practice_' + (i + 1) + '_item'] = p.item_id;
    row['practice_' + (i + 1) + '_answer'] = p.answer;
    row['practice_' + (i + 1) + '_seconds'] = p.seconds;
  });
  ['trust', 'distrust', 'verify_intent', 'perceived_accuracy',
   'perceived_confidence',
   'numeracy', 'ai_familiarity', 'attention_check',
   'age', 'gender'].forEach(function (k) {
    row[k] = S.post[k];
  });
  post('person', row);
}

// ---- condition assignment -------------------------------------------------
function assign() {
  var cells = Object.keys(STIM.trials);
  S.build = STIM.build;
  S.cell = (CELL && STIM.trials[CELL]) ? CELL : cells[Math.floor(Math.random() * cells.length)];
  var versions = Object.keys(STIM.trials[S.cell]);
  S.version = parseInt(versions[Math.floor(Math.random() * versions.length)], 10);
}

function materialise() {
  var byVersion = STIM.trials[S.cell];
  var set = byVersion && byVersion[String(S.version)];
  if (!set) {
    throw new Error('no stimuli for ' + S.cell + ' v' + S.version);
  }
  TRIALS = set.slice().sort(function (a, b) { return a.p - b.p; });
  var used = {};
  TRIALS.forEach(function (t) { used[t.i] = 1; });
  PRACTICE = Object.keys(STIM.items).filter(function (k) { return !used[k]; })
                   .sort().slice(0, N_PRACTICE);
}

// ---- scale rendering ------------------------------------------------------
function scale(name, lo, hi, n) {
  var out = '<div class="scale">';
  for (var i = 1; i <= n; i++) {
    out += '<label><input type="radio" name="' + name + '" value="' + i + '">' +
           '<span>' + i + '</span></label>';
  }
  out += '</div><div class="ends muted"><span>' + esc(lo) + '</span><span>' +
         esc(hi) + '</span></div>';
  return out;
}
// HTML min/max are advisory: a field marked max="100" will still hand us 500,
// and step="any" will hand us Infinity for "1e999". Every numeric field is
// read through here so a range can never be declared in the markup and then
// forgotten at the point it is read.
function readNum(id, lo, hi) {
  var raw = $(id).value.trim();
  if (raw === '') { return null; }
  var v = Number(raw);
  if (!isFinite(v) || v < lo || v > hi) { return null; }
  return v;
}

// Answers are figures copied out of a filing, so they may be negative (a loss)
// and we cannot bound them against the true value without shipping the answer
// key to a public page. This only rejects what no filing could contain.
var ANS_LIMIT = 1e12;

// Time this page spent hidden — another tab in front, the window minimised,
// the phone locked. A participant who walks away and comes back sits inside
// any time floor while having read nothing, so elapsed time on its own cannot
// tell attention from absence. Only visibilitychange is used: it is the signal
// browsers agree on, where window blur also fires for things that are not the
// participant leaving.
var hiddenMs = 0, hiddenSince = 0;
document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    hiddenSince = Date.now();
  } else if (hiddenSince) {
    hiddenMs += Date.now() - hiddenSince;
    hiddenSince = 0;
  }
});
function hiddenReset() { hiddenMs = 0; hiddenSince = document.hidden ? Date.now() : 0; }
function hiddenTotal() {
  return hiddenMs + (hiddenSince ? Date.now() - hiddenSince : 0);
}

// The one value that means "asked, and chose not to answer". Kept identical
// across languages and across both demographic items.
var DECLINED = 'prefer_not_to_say';

function choices(name, opts) {
  var out = '<div class="choices">';
  for (var i = 0; i < opts.length; i++) {
    out += '<label class="choice"><input type="radio" name="' + name +
           '" value="' + opts[i][0] + '"><span>' + esc(opts[i][1]) +
           '</span></label>';
  }
  return out + '</div>';
}
function picked(name) {
  var el = document.querySelector('input[name="' + name + '"]:checked');
  return el ? el.value : '';
}

// ===========================================================================
// SCREENS
// ===========================================================================
function show(html) { $('screen').innerHTML = html; window.scrollTo(0, 0); }

// The wording below is the approved information sheet, section for section.
// Do not shorten it: what the IRB approves is what the participant must read.
// If the approved document changes, change this and redeploy together.
function screenConsent() {
  progress(0.02);
  show(
    T.consentBody());
  $('yes').onclick = function () {
    S.consent = 'yes'; S.stage = 'instructions'; save(); screenInstructions();
  };
  $('no').onclick = function () {
    S.consent = 'no'; save(); postPerson(false);
    show(T.declined);
  };
}

function screenInstructions() {
  progress(0.06);
  show(
    T.instructionsBody());
  $('go').onclick = function () {
    var v = picked('comp');
    if (!v) { $('e').textContent = T.errChooseOne; return; }
    S.comprehension_tries++;
    if (v !== 'b') {
      $('e').textContent = T.errCompWrong;
      save(); return;
    }
    S.stage = 'practice'; S.idx = 0; save(); screenPractice();
  };
}

function screenPractice() {
  if (S.idx >= PRACTICE.length) {
    S.stage = 'trials'; S.idx = 0; save(); return screenTrial();
  }
  progress(0.08 + 0.04 * S.idx);
  var it = STIM.items[PRACTICE[S.idx]];
  var t0 = Date.now();
  show(
    '<h1>' + esc(T.practiceTitle(S.idx + 1, PRACTICE.length)) + '</h1>' +
    '<p class="muted">' + T.practiceNote + '</p>' +
    '<div class="card"><div class="muted">' + esc(it.co) + ' · FY' +
    esc(it.fy) + '</div><div class="excerpt">' + esc(it.x) + '</div>' +
    '<p class="q">' + esc(it.q) + '</p>' +
    '<input type="number" step="any" id="ans" autocomplete="off">' +
    '<span class="units">' + esc(it.u) + '</span>' +
    '<div class="err" id="e"></div></div>' +
    '<button id="go">' + T.btnSubmit + '</button>');
  $('ans').focus();
  $('go').onclick = function () {
    var v = readNum('ans', -ANS_LIMIT, ANS_LIMIT);
    if (v === null) { $('e').textContent = T.errNumber; return; }
    S.practice.push({item_id: PRACTICE[S.idx], answer: v,
                     seconds: Math.round((Date.now() - t0) / 1000)});
    S.idx++; save(); screenPractice();
  };
}

// ---- the trial ------------------------------------------------------------
function screenTrial() {
  if (S.idx >= N_TRIALS) { S.stage = 'post'; save(); return screenPost(); }
  var t = TRIALS[S.idx], it = STIM.items[t.i];
  var n = S.idx + 1;
  progress(0.16 + 0.62 * (S.idx / N_TRIALS));

  var t0 = Date.now();
  hiddenReset();
  show(
    '<h1>' + esc(T.itemTitle(n, N_TRIALS)) + '</h1>' +
    '<div class="card"><div class="muted">' + esc(it.co) + ' · FY' +
    esc(it.fy) + '</div><div class="excerpt">' + esc(it.x) + '</div>' +
    '<p class="q">' + esc(it.q) + '</p>' +
    '<input type="number" step="any" id="ans" autocomplete="off">' +
    '<span class="units">' + esc(it.u) + '</span>' +
    '<div class="err" id="e"></div></div>' +
    '<button id="go">' + T.btnSubmitMine + '</button>');
  $('ans').focus();
  $('go').onclick = function () {
    var v = readNum('ans', -ANS_LIMIT, ANS_LIMIT);
    if (v === null) { $('e').textContent = T.errNumber; return; }
    stage2(t, it, n, v, Math.round((Date.now() - t0) / 1000));
  };
}

function stage2(t, it, n, initial, t1) {
  var t0 = Date.now(), reopenCount = 0, reopenMs = 0, openedAt = 0;
  progress(0.16 + 0.62 * ((S.idx + 0.5) / N_TRIALS));
  show(
    '<h1>' + esc(T.itemTitle(n, N_TRIALS)) + '</h1>' +
    '<div class="card">' +
    '<p class="q">' + esc(it.q) + '</p>' +
    '<p class="muted">' + T.yourAnswerIs + ' <b>' + esc(initial) + '</b> ' +
    esc(it.u) + '</p>' +
    '<button class="ghost" id="toggle">' + T.btnShowExcerpt + '</button>' +
    '<div id="src" class="excerpt hidden" style="margin-top:12px">' +
    esc(it.x) + '</div>' +
    '</div>' +
    '<div class="card assistant">' +
    '<div class="who">' + T.assistantLabel + '</div>' +
    '<div>' + esc(t.a) + '</div>' +
    '<div class="conf">' + esc(t.c) + '</div>' +
    '</div>' +
    '<div class="card">' +
    '<p class="q">' + T.finalAnswerLabel + '</p>' +
    '<input type="number" step="any" id="fin" autocomplete="off" value="' +
    esc(initial) + '">' +
    '<span class="units">' + esc(it.u) + '</span>' +
    '<div class="err" id="e"></div></div>' +
    '<button id="go">' + T.btnSubmitFinal + '</button>');

  $('toggle').onclick = function () {
    var box = $('src');
    if (box.classList.contains('hidden')) {
      box.classList.remove('hidden');
      reopenCount++; openedAt = Date.now();
      this.textContent = T.btnHideExcerpt;
    } else {
      box.classList.add('hidden');
      if (openedAt) { reopenMs += Date.now() - openedAt; openedAt = 0; }
      this.textContent = T.btnShowExcerpt;
    }
  };

  $('go').onclick = function () {
    var v = readNum('fin', -ANS_LIMIT, ANS_LIMIT);
    if (v === null) { $('e').textContent = T.errNumber; return; }
    if (openedAt) { reopenMs += Date.now() - openedAt; openedAt = 0; }
    var row = {
      participant: S.participant, prolific_pid: PROLIFIC_PID,
      session: SESSION_ID, cell: S.cell, version: S.version,
      build: S.build, lang: T.htmlLang,
      position: t.p, item_id: t.i,
      initial_estimate: initial, final_estimate: v,
      t_stage1: t1, t_stage2: Math.round((Date.now() - t0) / 1000),
      reopen_count: reopenCount, reopen_ms: reopenMs,
      hidden_ms: hiddenTotal()
    };
    S.trials.push(row);
    postTrial(row);
    S.idx++; save();
    screenTrial();
  };
}

function screenPost() {
  progress(0.84);
  show(
    T.postBody());
  // Ticking the box clears and disables the number, so a participant cannot
  // submit an age and a refusal at the same time.
  $('age_pns').onchange = function () {
    $('age').disabled = this.checked;
    if (this.checked) { $('age').value = ''; }
  };
  $('go').onclick = function () {
    var age = $('age').value.trim();
    var t = picked('trust'), d = picked('distrust'), v = picked('verify'),
        f = picked('fam'), a = picked('att'), g = picked('gender');
    if (!t || !d || !v || !f || !a || !g ||
        $('pa').value.trim() === '' || $('pc').value.trim() === '' ||
        $('num').value.trim() === '') {
      $('e').textContent = T.errAnswerAll; return;
    }
    // All three are proportions of a fixed whole, so anything outside 0-100 is
    // a slip or a keyboard mash, not an opinion worth recording.
    var pa = readNum('pa', 0, 100), pc = readNum('pc', 0, 100),
        num = readNum('num', 0, 100);
    if (pa === null || pc === null || num === null) {
      $('e').textContent = T.errRange0100; return;
    }
    // Declining age is a recorded answer, not an empty cell: a blank could not
    // be told apart from a row that failed to write. Both this and gender
    // store the same code, so one filter finds every refusal.
    var ageDeclined = $('age_pns').checked;
    if (!ageDeclined &&
        (age === '' || isNaN(Number(age)) ||
         Number(age) < 18 || Number(age) > 99)) {
      $('e').textContent = T.errAge; return;
    }
    S.post = {trust: t, distrust: d, verify_intent: v,
              perceived_accuracy: pa,
              perceived_confidence: pc, numeracy: num,
              ai_familiarity: f, attention_check: a,
              age: ageDeclined ? DECLINED : Number(age), gender: g};
    S.stage = 'debrief'; save(); screenDebrief();
  };
}

// The approved debriefing document, and the acknowledgement that stands in for
// the signature the paper form asks for. The participant row is posted only
// after the choice below, so debrief_consent lands with it in one write.
function screenDebrief() {
  progress(1);
  // Post once on arrival so that closing the tab here does not lose the
  // post-block measures, and again after the choice below. Two rows for one
  // participant are expected: prepare_web.py keeps the last one written.
  postPerson(true);
  show(
    T.debriefBody());

  function finish(answer) {
    S.debrief_consent = answer;
    save();
    postPerson(true);
    var code = COMPLETION_URL;
    show(
      '<h1>' + esc(T.thanksTitle) + '</h1>' +
      '<div class="card">' +
      (answer === 'yes' ? T.thanksUsed : T.thanksNotUsed) +
      (code
        ? '<p><a href="' + esc(code) + '">' + T.returnToProlific + '</a></p>'
        : T.mayClose) +
      '</div>');
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  }

  $('use').onclick = function () { finish('yes'); };
  $('nouse').onclick = function () { finish('no'); };
}

// ---- boot -----------------------------------------------------------------
function boot() {
  var prev = load();
  // Only resume a run from this same build. Stimuli change between versions,
  // and a saved run naming a condition that no longer exists would otherwise
  // throw here and leave the participant looking at an empty page.
  var resumable = prev && prev.participant && prev.stage !== 'debrief' &&
                  prev.build === STIM.build &&
                  (!PROLIFIC_PID || prev.prolific_pid === PROLIFIC_PID);
  if (resumable) {
    S = prev;
    try {
      materialise();
    } catch (e) {
      resumable = false;
    }
  }
  if (!resumable) {
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
  }
  if (resumable) {
    show('<h1>' + esc(T.welcomeBackTitle) + '</h1>' + T.welcomeBackBody +
         '<button id="resume">' + T.btnResume + '</button> ' +
         '<button class="ghost" id="restart">' + T.btnRestart + '</button>');
    $('resume').onclick = function () {
      ({consent: screenConsent, instructions: screenInstructions,
        practice: screenPractice, trials: screenTrial,
        post: screenPost, debrief: screenDebrief}[S.stage] || screenConsent)();
    };
    $('restart').onclick = function () {
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      location.reload();
    };
    return;
  }
  S.participant = uid();
  S.prolific_pid = PROLIFIC_PID;
  S.startedAt = Date.now();
  assign();
  materialise();
  save();
  screenConsent();
}

// A page that renders nothing is indistinguishable from a broken link. If boot
// fails for any reason, say so on screen rather than leaving a blank page.
function safeBoot() {
  try {
    boot();
  } catch (e) {
    try { localStorage.removeItem(LS_KEY); } catch (e2) {}
    show('<h1>' + esc(T.bootFailedTitle) + '</h1>' +
         '<div class="card">' + T.bootFailedBody +
         '<p class="muted">' + esc(String(e && e.message || e)) + '</p></div>');
  }
}

window.addEventListener('beforeunload', function () {
  if (S.stage === 'trials' && S.trials.length) { try { save(); } catch (e) {} }
});

safeBoot();
</script>
